name: Vibe browser reachable

# Checks that an agent can actually drive Chrome — not merely that the relay is
# up. See scripts/vibe-check.sh for why those are different things.
#
# It runs on GitHub because the two ends it watches are the two machines that
# keep going dark: the VM and Dan's Mac.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: vibe-relay
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Can an agent actually drive the browser?
        env:
          URL: ${{ secrets.VIBE_MCP_URL }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/vibe-check.sh
